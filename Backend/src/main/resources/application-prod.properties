spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

football.api.base-url=${FOOTBALL_API_BASE_URL:https://v3.football.api-sports.io}
football.api.key=${FOOTBALL_API_KEY:}

# Keep table + results close to real-time FT (override via env on Render if needed).
app.epl.data-dir=${EPL_DATA_DIR:data/epl-sync}
app.epl.cache-stale-minutes=${EPL_CACHE_STALE_MINUTES:2}
app.epl.cache-refresh-ms=${EPL_CACHE_REFRESH_MS:120000}
app.epl.cache-live-stale-minutes=${EPL_CACHE_LIVE_STALE_MINUTES:1}

management.endpoints.web.exposure.include=health